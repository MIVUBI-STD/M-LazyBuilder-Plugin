name: Launcher Verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher-check:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/launcher
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/launcher/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify Launcher source contract
        run: npm run verify:source

  launcher-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Verify local Launcher packaging contract
        run: python scripts/verify_local_launcher_contract.py
