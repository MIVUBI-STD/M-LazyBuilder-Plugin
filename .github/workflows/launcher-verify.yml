name: Launcher Verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher-check:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/launcher
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/launcher/package-lock.json
      - name: Select pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustc --version
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify Launcher source contract
        run: npm run verify:source

  launcher-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Verify local Launcher packaging contract
        run: python scripts/verify_local_launcher_contract.py
      - name: Verify Launcher release signing contract
        run: python scripts/verify_launcher_release_contract.py
      - name: Verify Launcher production hardening contract
        run: python scripts/verify_launcher_hardening_contract.py
      - name: Verify Launcher cross-runtime compatibility contract
        run: python scripts/verify_compatibility.py
      - name: Verify Launcher data preservation contract
        run: python scripts/verify_launcher_data_preservation_contract.py
      - name: Verify Launcher failure recovery matrix
        run: python scripts/verify_launcher_failure_matrix.py
      - name: Verify Launcher scalability contract
        run: python scripts/verify_launcher_scalability_contract.py
      - name: Verify Launcher production ownership contract
        run: python scripts/verify_launcher_ownership_contract.py
      - name: Verify Launcher structured error UX
        run: python scripts/verify_launcher_error_ux.py
      - name: Verify Launcher accessibility contract
        run: python scripts/verify_launcher_accessibility_contract.py
      - name: Verify Launcher notification contract
        run: python scripts/verify_launcher_notification_contract.py
      - name: Verify Launcher runtime bridge contract
        run: python scripts/verify_launcher_bridge_contract.py
      - name: Verify Launcher command surface
        run: python scripts/verify_launcher_command_surface.py
      - name: Verify Launcher tracked operation coverage
        run: python scripts/verify_launcher_operation_coverage.py
      - name: Verify Launcher metadata durability
        run: python scripts/verify_launcher_metadata_durability.py
      - name: Verify Launcher contract wiring
        run: python scripts/verify_launcher_contract_wiring.py
      - name: Verify updater tooling without signing secrets
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/build_launcher_update_manifest.py \
            scripts/verify_launcher_update_manifest.py \
            scripts/set_launcher_version.py \
            scripts/verify_launcher_hardening_contract.py \
            scripts/verify_compatibility.py \
            scripts/verify_launcher_data_preservation_contract.py \
            scripts/verify_launcher_failure_matrix.py \
            scripts/verify_launcher_scalability_contract.py \
            scripts/verify_launcher_ownership_contract.py \
            scripts/verify_launcher_error_ux.py \
            scripts/verify_launcher_accessibility_contract.py \
            scripts/verify_launcher_notification_contract.py \
            scripts/verify_launcher_bridge_contract.py \
            scripts/verify_launcher_command_surface.py \
            scripts/verify_launcher_operation_coverage.py \
            scripts/verify_launcher_metadata_durability.py \
            scripts/verify_launcher_contract_wiring.py
          mkdir -p .artifacts/updater-contract
          printf '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ' > .artifacts/updater-contract/example.sig
          VERSION=$(python - <<'PY'
          import json
          print(json.load(open('apps/launcher/package.json', encoding='utf-8'))['version'])
          PY
          )
          python scripts/build_launcher_update_manifest.py \
            --version "$VERSION" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/launcher-v$VERSION/LazyBuilder_${VERSION}_x64-setup.exe" \
            --signature-file .artifacts/updater-contract/example.sig \
            --output .artifacts/updater-contract/latest.json
          python scripts/verify_launcher_update_manifest.py \
            .artifacts/updater-contract/latest.json \
            --version "$VERSION"
