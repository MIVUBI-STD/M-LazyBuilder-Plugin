name: Verify

on:
  push:
    branches: [Local, main]
  pull_request:
    branches: [Local, main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify repository contracts and versions
        run: python scripts/verify_versions.py

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test Paper modules
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Upload tested core modules
        uses: actions/upload-artifact@v4
        with:
          name: LazyBuilder-Core-${{ github.sha }}
          path: |
            modules/world-manager/target/World-Manager-0.1.0-SNAPSHOT.jar
            modules/utilities-manager/target/Utilities-Manager-0.1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Compile Fabric client
        run: gradle -p client/fabric --no-daemon build

  tauri-desktop:
    needs: paper
    runs-on: windows-latest
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: EngineData/Frontend/RustApp/package-lock.json
      - name: Download tested core modules
        uses: actions/download-artifact@v4
        with:
          name: LazyBuilder-Core-${{ github.sha }}
          path: EngineData/Frontend/RustApp/src-tauri/resources/core
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck Svelte frontend
        run: npm run typecheck
      - name: Build Svelte frontend
        run: npm run build:frontend
      - name: Generate Tauri icon assets
        run: npx tauri icon src-tauri/app-icon.svg
      - name: Cache Rust dependencies and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            EngineData/Frontend/RustApp/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('EngineData/Frontend/RustApp/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check Rust/Tauri backend
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Test Rust/Tauri backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build LazyBuilder and NSIS installer
        run: npm run build:app
      - name: Upload Windows application and installer
        uses: actions/upload-artifact@v4
        with:
          name: LazyBuilder-Windows-${{ github.sha }}
          path: |
            EngineData/Frontend/RustApp/src-tauri/target/release/lazybuilder.exe
            EngineData/Frontend/RustApp/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
