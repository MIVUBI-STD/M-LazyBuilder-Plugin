name: Verify

on:
  push:
    branches: [Local, main]
  pull_request:
    branches: [Local, main]

permissions:
  contents: read

jobs:
  server-and-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test Paper modules
        run: mvn --batch-mode --no-transfer-progress verify
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Compile Fabric client
        run: gradle -p client/fabric --no-daemon build

  tauri-desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: EngineData/Frontend/RustApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm install
      - name: Typecheck Svelte frontend
        run: npm run typecheck
      - name: Build Svelte frontend
        run: npm run build:frontend
      - name: Generate Tauri icon assets
        run: npx tauri icon src-tauri/app-icon.svg
      - name: Check Rust/Tauri backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

  legacy-wpf-transition:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile transitional WPF source until Tauri parity is proven
        run: dotnet build apps/lazybuilder-desktop/LazyBuilder.Desktop.csproj --configuration Release
