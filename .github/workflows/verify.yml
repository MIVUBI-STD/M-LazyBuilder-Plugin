name: Verify

on:
  push:
    branches: [Local, main]
  pull_request:
    branches: [Local, main]

permissions:
  contents: read

jobs:
  server-and-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test Paper modules
        run: mvn --batch-mode --no-transfer-progress verify
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Compile Fabric client
        run: gradle -p client/fabric --no-daemon build

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile LazyBuilder desktop
        run: dotnet build apps/lazybuilder-desktop/LazyBuilder.Desktop.csproj --configuration Release
