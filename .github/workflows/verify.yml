name: Verify

on:
  push:
    branches: [Local, main]
    paths-ignore:
      - 'docs/04-system/*-audit.md'
      - 'docs/04-system/*-lock.md'
      - 'docs/04-system/*-status.md'
      - 'docs/05-operations/*-testing-notes.md'
      - 'docs/05-operations/*-handoff.md'
      - 'docs/05-operations/remote-github-complete.md'
  pull_request:
    branches: [Local, main]
    paths-ignore:
      - 'docs/04-system/*-audit.md'
      - 'docs/04-system/*-lock.md'
      - 'docs/04-system/*-status.md'
      - 'docs/05-operations/*-testing-notes.md'
      - 'docs/05-operations/*-handoff.md'
      - 'docs/05-operations/remote-github-complete.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Verify repository routing and ownership contracts
        run: python scripts/verify_repository_contract.py
      - name: Verify repository contracts and versions
        run: python scripts/verify_versions.py
      - name: Verify local Launcher packaging contract
        run: python scripts/verify_local_launcher_contract.py
      - name: Verify Launcher release signing contract
        run: python scripts/verify_launcher_release_contract.py
      - name: Verify Launcher production hardening contract
        run: python scripts/verify_launcher_hardening_contract.py
      - name: Verify Launcher cross-runtime compatibility contract
        run: python scripts/verify_compatibility.py
      - name: Verify Launcher data preservation contract
        run: python scripts/verify_launcher_data_preservation_contract.py
      - name: Verify Launcher failure recovery matrix
        run: python scripts/verify_launcher_failure_matrix.py
      - name: Verify Launcher scalability contract
        run: python scripts/verify_launcher_scalability_contract.py
      - name: Verify Launcher production ownership contract
        run: python scripts/verify_launcher_ownership_contract.py
      - name: Verify Launcher structured error UX
        run: python scripts/verify_launcher_error_ux.py
      - name: Verify Launcher accessibility contract
        run: python scripts/verify_launcher_accessibility_contract.py
      - name: Verify Launcher notification contract
        run: python scripts/verify_launcher_notification_contract.py
      - name: Verify Launcher runtime bridge contract
        run: python scripts/verify_launcher_bridge_contract.py
      - name: Verify Launcher command surface
        run: python scripts/verify_launcher_command_surface.py
      - name: Verify Launcher tracked operation coverage
        run: python scripts/verify_launcher_operation_coverage.py
      - name: Verify Launcher metadata durability
        run: python scripts/verify_launcher_metadata_durability.py
      - name: Verify Launcher contract wiring
        run: python scripts/verify_launcher_contract_wiring.py

  launcher-check:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/launcher
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/launcher/package-lock.json
      - name: Install exact Launcher dependencies
        run: npm ci
      - name: Verify Launcher source boundary
        run: npm run verify:source

  paper:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test Paper plugins through repository wrapper
        run: .\mvnw.cmd --batch-mode --no-transfer-progress verify
      - name: Stage tested core plugins
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ".artifacts/core" -Force | Out-Null
          Copy-Item "plugins/world-manager/target/World-Manager-0.1.0-SNAPSHOT.jar" ".artifacts/core/"
          Copy-Item "plugins/utilities-manager/target/Utilities-Manager-0.1.0-SNAPSHOT.jar" ".artifacts/core/"
      - name: Upload tested core plugins
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: LazyBuilder-Core-${{ github.sha }}
          path: .artifacts/core/*.jar
          if-no-files-found: error
          retention-days: 7

  paper-runtime-smoke:
    name: Paper runtime proofs (managed-world, multi-instance, restart)
    needs: paper
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download tested Paper plugins
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: LazyBuilder-Core-${{ github.sha }}
          path: .artifacts/core
      - name: Download stable Paper 1.21.4 runtime
        shell: pwsh
        run: |
          $headers = @{
            "User-Agent" = "LazyBuilder-CI/0.1 (https://github.com/halokaryamedia-source/LazyBuilder-Plugin)"
          }
          $builds = Invoke-RestMethod `
            -Headers $headers `
            -Uri "https://fill.papermc.io/v3/projects/paper/versions/1.21.4/builds" `
            -TimeoutSec 30
          $stable = $builds | Where-Object { $_.channel -eq "STABLE" } | Select-Object -First 1
          if ($null -eq $stable) {
            throw "PaperMC did not return a stable Paper 1.21.4 build."
          }
          $download = $stable.downloads.'server:default'.url
          if ([string]::IsNullOrWhiteSpace($download)) {
            throw "PaperMC stable build did not expose a server download URL."
          }
          New-Item -ItemType Directory -Path ".artifacts" -Force | Out-Null
          Invoke-WebRequest -Headers $headers -Uri $download -OutFile ".artifacts/paper-1.21.4.jar" -TimeoutSec 120
      - name: Execute Paper managed-world lifecycle proof
        shell: pwsh
        run: |
          ./scripts/verify-paper-runtime.ps1 `
            -ServerJar ".artifacts/paper-1.21.4.jar" `
            -WorldManagerJar ".artifacts/core/World-Manager-0.1.0-SNAPSHOT.jar" `
            -UtilitiesManagerJar ".artifacts/core/Utilities-Manager-0.1.0-SNAPSHOT.jar"
      - name: Execute Paper multi-instance runtime proof (1 -> 2 -> 3)
        shell: pwsh
        run: |
          ./scripts/verify-paper-multi-instance-runtime.ps1 `
            -ServerJar ".artifacts/paper-1.21.4.jar" `
            -WorldManagerJar ".artifacts/core/World-Manager-0.1.0-SNAPSHOT.jar" `
            -UtilitiesManagerJar ".artifacts/core/Utilities-Manager-0.1.0-SNAPSHOT.jar"
      - name: Execute Paper restart and persistence proof
        shell: pwsh
        run: ./scripts/verify-paper-restart.ps1 -ServerJar ".artifacts/paper-1.21.4.jar"
      - name: Upload Paper runtime proof evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: LazyBuilder-Paper-Runtime-Proof-${{ github.sha }}
          path: |
            .runtime-proof/paper-smoke/logs/**
            .runtime-proof/paper-smoke/plugins/**/config.yml
            .runtime-proof/paper-smoke/plugins/World-Manager/world/registry.yml
            .runtime-proof/paper-smoke/server.properties
            .runtime-proof/paper-multi-instance/**/logs/**
            .runtime-proof/paper-multi-instance/**/server.properties
          if-no-files-found: warn
          retention-days: 7

  fabric:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify required Fabric client suite
        shell: pwsh
        run: .\tooling\windows-toolchain\scripts\verify\verify-fabric.ps1 -RepoRoot "."
      - name: Stage required client mods
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ".artifacts/client-mods" -Force | Out-Null
          Copy-Item "mods/map-manager/build/libs/lazybuilder-map-manager-0.1.0-SNAPSHOT.jar" ".artifacts/client-mods/"
          Copy-Item "mods/utility-manager/build/libs/lazybuilder-utility-manager-0.1.0-SNAPSHOT.jar" ".artifacts/client-mods/"
          Copy-Item "mods/performance-manager/build/libs/lazybuilder-performance-manager-0.1.0-SNAPSHOT.jar" ".artifacts/client-mods/"
      - name: Verify packaged client mod contents
        shell: powershell
        run: .\tooling\windows-toolchain\scripts\verify\verify-client-artifacts.ps1 -ClientModsDir ".artifacts\client-mods" -RepoRoot "."
      - name: Upload tested client mods
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: LazyBuilder-Client-${{ github.sha }}
          path: .artifacts/client-mods/*.jar
          if-no-files-found: error
          retention-days: 7

  tauri-desktop:
    needs: [consistency, launcher-check, paper, paper-runtime-smoke, fabric]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/launcher
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/launcher/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Download tested core plugins
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: LazyBuilder-Core-${{ github.sha }}
          path: apps/launcher/src-tauri/resources/core
      - name: Download tested client mods
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: LazyBuilder-Client-${{ github.sha }}
          path: apps/launcher/src-tauri/resources/client-mods
      - name: Install frontend dependencies
        run: npm ci
      - name: Cache Rust dependencies and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/launcher/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/launcher/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build LazyBuilder and NSIS installer
        run: npm run build:app
      - name: Package canonical Local installer
        shell: pwsh
        working-directory: .
        run: |
          $installer = Get-ChildItem "apps/launcher/src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" -File | Select-Object -First 1
          if ($null -eq $installer) { throw "Tauri NSIS installer was not found." }
          ./tooling/windows-toolchain/scripts/distribution/package-local.ps1 `
            -RepoRoot "." `
            -InstallerPath $installer.FullName `
            -CommitSha "${{ github.sha }}" `
            -RunNumber "${{ github.run_number }}"
      - name: Smoke test canonical Local installer
        shell: pwsh
        working-directory: .
        run: ./tooling/windows-toolchain/scripts/distribution/verify-installer.ps1 -InstallerPath "dist/Local/LazyBuilder-Setup-Local.exe"
      - name: Write exact-commit build provenance
        working-directory: .
        run: >-
          python scripts/write_build_provenance.py
          --output dist/Local/build-provenance.json
          --repository "${{ github.repository }}"
          --ref "${{ github.ref }}"
          --commit "${{ github.sha }}"
          --run-number "${{ github.run_number }}"
          --run-id "${{ github.run_id }}"
      - name: Upload canonical Local test package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: LazyBuilder-Local-${{ github.sha }}
          path: dist/Local/**
          if-no-files-found: error
          retention-days: 14
      - name: Upload developer diagnostic executable
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: LazyBuilder-Diagnostics-${{ github.sha }}
          path: apps/launcher/src-tauri/target/release/lazybuilder.exe
          if-no-files-found: error
          retention-days: 7
