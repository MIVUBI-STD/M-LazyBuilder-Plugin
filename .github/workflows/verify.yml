name: Verify

on:
  push:
    branches: [Local, main]
  pull_request:
    branches: [Local, main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify repository contracts and versions
        run: python scripts/verify_versions.py

  launcher-check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/launcher/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck Svelte frontend
        run: npm run typecheck
      - name: Build Svelte frontend
        run: npm run build:frontend
      - name: Generate Tauri icon assets
        run: npx tauri icon src-tauri/app-icon.svg
      - name: Check Rust/Tauri backend
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Test Rust/Tauri backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test Paper plugins
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Stage tested core plugins
        run: |
          mkdir -p .artifacts/core
          cp plugins/world-manager/target/World-Manager-0.1.0-SNAPSHOT.jar .artifacts/core/
          cp plugins/utilities-manager/target/Utilities-Manager-0.1.0-SNAPSHOT.jar .artifacts/core/
      - name: Upload tested core plugins
        uses: actions/upload-artifact@v4
        with:
          name: LazyBuilder-Core-${{ github.sha }}
          path: .artifacts/core/*.jar
          if-no-files-found: error
          retention-days: 7

  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Compile Map Manager
        run: gradle -p mods/map-manager --no-daemon build
      - name: Compile Utility Manager
        run: gradle -p mods/utility-manager --no-daemon build
      - name: Compile Performance Manager
        run: gradle -p mods/performance-manager --no-daemon build
      - name: Stage required client mods
        run: |
          mkdir -p .artifacts/client-mods
          cp mods/map-manager/build/libs/lazybuilder-map-manager-0.1.0-SNAPSHOT.jar .artifacts/client-mods/
          cp mods/utility-manager/build/libs/lazybuilder-utility-manager-0.1.0-SNAPSHOT.jar .artifacts/client-mods/
          cp mods/performance-manager/build/libs/lazybuilder-performance-manager-0.1.0-SNAPSHOT.jar .artifacts/client-mods/
      - name: Upload tested client mods
        uses: actions/upload-artifact@v4
        with:
          name: LazyBuilder-Client-${{ github.sha }}
          path: .artifacts/client-mods/*.jar
          if-no-files-found: error
          retention-days: 7

  tauri-desktop:
    needs: [launcher-check, paper, fabric]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/launcher/package-lock.json
      - name: Download tested core plugins
        uses: actions/download-artifact@v4
        with:
          name: LazyBuilder-Core-${{ github.sha }}
          path: apps/launcher/src-tauri/resources/core
      - name: Download tested client mods
        uses: actions/download-artifact@v4
        with:
          name: LazyBuilder-Client-${{ github.sha }}
          path: apps/launcher/src-tauri/resources/client-mods
      - name: Install frontend dependencies
        run: npm ci
      - name: Cache Rust dependencies and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/launcher/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/launcher/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build LazyBuilder and NSIS installer
        run: npm run build:app
      - name: Upload Windows application and installer
        uses: actions/upload-artifact@v4
        with:
          name: LazyBuilder-Windows-${{ github.sha }}
          path: |
            apps/launcher/src-tauri/target/release/lazybuilder.exe
            apps/launcher/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
