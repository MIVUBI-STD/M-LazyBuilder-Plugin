name: Performance Manager Verify

on:
  push:
    branches: [Local]
    paths:
      - 'mods/performance-manager/**'
      - '.github/workflows/performance-manager-verify.yml'
  pull_request:
    branches: [Local, main]
    paths:
      - 'mods/performance-manager/**'
      - '.github/workflows/performance-manager-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-manager-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache LazyBuilder Gradle runtime
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~\AppData\Local\LazyBuilder\build-tools\gradle-user-home
            ~\AppData\Local\LazyBuilder\build-tools\gradle
          key: ${{ runner.os }}-lazybuilder-gradle-${{ hashFiles('toolchain.json', 'mods/performance-manager/settings.gradle', 'mods/performance-manager/build.gradle', 'mods/performance-manager/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-lazybuilder-gradle-
      - name: Build and test Performance Manager
        shell: pwsh
        run: .\tooling\windows-toolchain\scripts\verify\invoke-gradle-build.ps1 -RepoRoot "." -ProjectPath "mods/performance-manager"
      - name: Stage verified artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ".artifacts/performance-manager" -Force | Out-Null
          Copy-Item "mods/performance-manager/build/libs/lazybuilder-performance-manager-0.1.0-SNAPSHOT.jar" ".artifacts/performance-manager/"
      - name: Upload verified Performance Manager
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: LazyBuilder-Performance-Manager-${{ github.sha }}
          path: .artifacts/performance-manager/*.jar
          if-no-files-found: error
          retention-days: 7
