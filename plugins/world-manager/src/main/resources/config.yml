world-manager:
  # Blank = use the server's primary loaded world as the global safety fallback.
  # Set this to a loaded world name to choose an explicit fallback destination.
  fallback-world: ''

  idle-unload:
    # Managed worlds are loaded automatically when a builder teleports to them.
    # Empty worlds are unloaded automatically after this idle window.
    enabled: true
    minutes: 10

  build-performance:
    # SAFE DEFAULT: no managed worlds are opted into aggressive entity behavior changes.
    # List exact managed world FOLDER names to opt in per world; "*" is unsupported.
    # Existing configs with the old disable-* switches but no enabled-worlds
    # remain non-mutating until individual world folders are explicitly listed.
    enabled-worlds: []
    # These flags configure the opted-in profile only (not global world defaults).
    disable-all-mob-ai: true
    disable-villager-ai: true
    disable-breeding: true
    # Scans loaded entities once on enable. Lease restoration still runs when false.
    scan-loaded-entities-on-enable: true
    # Tags apply only within opted-in managed worlds:
    #   lazybuilder_gameplay_ai -> skip suppression; restore only LazyBuilder-owned AI
    #   lazybuilder_decorative  -> suppress AI with a reversible LazyBuilder PDC lease
    # Unloaded/stopped entities have their owned leases restored before saving.
    # Untagged legacy NoAI states cannot safely be guessed or changed.

  import:
    # Conservative defaults for a local builder workflow. Increase only for known large worlds.
    max-files: 100000
    max-uncompressed-mb: 16384

  conversion:
    max-heap-mb: 3072
    timeout-minutes: 60

  transfer:
    # Kept below Minecraft custom-payload ceilings so protocol framing has room.
    chunk-bytes: 24576
    # Conservative default for local transfers. Increase explicitly for unusually large archives.
    max-upload-mb: 8192
    # An inactive transfer may be reclaimed on the next request/disconnect; no polling timer is used.
    session-idle-seconds: 300
