plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}

if (gradle.gradleVersion != '8.12') {
    throw new GradleException("LazyBuilder Performance Manager requires Gradle 8.12; found ${gradle.gradleVersion}")
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

sourceSets {
    gametest {
        compileClasspath += main.output
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.output
        runtimeClasspath += main.runtimeClasspath
    }
}

loom.mods.register('lazybuilder-performance-manager-visual-proof') {
    sourceSet sourceSets.gametest
}

loom {
    runs {
        clientGameTest {
            client()
            name = 'LazyBuilder Performance Manager Visual Proof'
            source sourceSets.gametest
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.disableNetworkSynchronizer=true'
            vmArg "-Dfabric.client.gametest.testModResourcesPath=${file('src/gametest/resources').absolutePath}"
            runDir 'build/run/clientGameTest'
            programArg '--username'
            programArg 'LBPerformancePreview'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
