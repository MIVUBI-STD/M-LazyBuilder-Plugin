plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}

if (gradle.gradleVersion != '8.12') {
    throw new GradleException("LazyBuilder Fabric requires Gradle 8.12; found ${gradle.gradleVersion}")
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', '../../shared/protocol/src/main/java']
            include 'com/halokaryamedia/lazybuilder/client/**'
            include 'com/halokaryamedia/lazybuilder/world/transfer/TransferWireProtocol.java'
            include 'com/halokaryamedia/lazybuilder/world/transfer/TransferDescriptor.java'
            include 'com/halokaryamedia/lazybuilder/world/map/MapActionWireProtocol.java'
            include 'com/halokaryamedia/lazybuilder/world/control/WorldControlWireProtocol.java'
            include 'com/halokaryamedia/lazybuilder/world/registry/WorldId.java'
        }
    }
    gametest {
        compileClasspath += main.output
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.output
        runtimeClasspath += main.runtimeClasspath
    }
}

// Loom 1.9.2 predates fabricApi.configureTests. Mirror the manual client-gametest
// setup used by Fabric API 0.119.4 itself so the production toolchain stays unchanged.
loom.mods.register('lazybuilder-map-manager-visual-proof') {
    sourceSet sourceSets.gametest
}

loom {
    runs {
        clientGameTest {
            client()
            name = 'LazyBuilder Map Manager Visual Proof'
            source sourceSets.gametest
            vmArg '-Dfabric.client.gametest'
            vmArg "-Dfabric.client.gametest.testModResourcesPath=${file('src/gametest/resources').absolutePath}"
            runDir 'build/run/clientGameTest'
            programArg '--username'
            programArg 'LazyBuilderPreview'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
