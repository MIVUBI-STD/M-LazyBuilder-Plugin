org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=false

# Axiom 5.3.0 is published with Loom 1.14 metadata while LazyBuilder's repository
# toolchain is intentionally pinned to Gradle 8.12 / Loom 1.9.2. We consume Axiom
# only as an external runtime/public API dependency and validate compatibility in CI,
# so allow Loom to remap it instead of rejecting solely on producer Loom metadata.
loom.ignoreDependencyLoomVersionValidation=true

minecraft_version=1.21.4
yarn_mappings=1.21.4+build.8
loader_version=0.16.10
fabric_version=0.119.4+1.21.4
mod_version=0.1.0-SNAPSHOT
maven_group=com.halokaryamedia
archives_base_name=lazybuilder-builder-utilities
axiom_modrinth_project=N6n5dqoA
axiom_modrinth_version=b7V5vQES
