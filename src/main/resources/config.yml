world-manager:
  # Blank = use the server's primary loaded world as the global safety fallback.
  # Set this to a loaded world name to choose an explicit fallback destination.
  fallback-world: ''

  import:
    max-files: 200000
    max-uncompressed-mb: 65536

  conversion:
    max-heap-mb: 3072
    timeout-minutes: 60

  transfer:
    # Kept below common plugin/custom-payload ceilings so future transport framing has room.
    chunk-bytes: 24576
    # Hard cap for one uploaded .zip/.mcworld before it is accepted into world/imports.
    max-upload-mb: 16384
