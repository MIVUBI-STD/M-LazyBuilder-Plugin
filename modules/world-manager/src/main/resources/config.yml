world-manager:
  # Blank = use the server's primary loaded world as the global safety fallback.
  # Set this to a loaded world name to choose an explicit fallback destination.
  fallback-world: ''

  build-performance:
    # Dedicated build worlds do not need normal Minecraft mob brains running continuously.
    # Set to false for servers that regularly test gameplay AI inside managed worlds.
    disable-all-mob-ai: true
    # Kept separately so villager AI can remain suppressed even if general mob AI is re-enabled.
    disable-villager-ai: true
    # Build worlds normally do not need passive background breeding work.
    disable-breeding: true
    # One bounded pass on plugin enable; no recurring entity scanner is used.
    scan-loaded-entities-on-enable: true
    # Runtime escape hatches are scoreboard tags:
    #   lazybuilder_gameplay_ai -> keep/restore AI for that mob
    #   lazybuilder_decorative  -> force No-AI even when general suppression is disabled

  import:
    max-files: 200000
    max-uncompressed-mb: 65536

  conversion:
    max-heap-mb: 3072
    timeout-minutes: 60

  transfer:
    # Kept below Minecraft custom-payload ceilings so protocol framing has room.
    chunk-bytes: 24576
    # Hard cap for one uploaded .zip/.mcworld before it is accepted into world/imports.
    max-upload-mb: 16384
    # An inactive transfer may be reclaimed on the next request/disconnect; no polling timer is used.
    session-idle-seconds: 300
