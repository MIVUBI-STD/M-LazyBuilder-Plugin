features:
  world-safety:
    enabled: true
    scope:
      # all = protect every world except exclusions
      # include = protect only worlds listed in include-worlds
      mode: all
      include-worlds: []
      exclude-worlds: []
    protections:
      explosions: true
      leaves-decay: true
      farmland-trample: true
      dragon-egg-teleport: true

  movement:
    enabled: true
    abilities:
      advanced-fly: true
      noclip: true
      night-vision: true

  build-helpers:
    enabled: true
    helpers:
      iron-door-toggle: true
      double-slab-break: true
      glazed-terracotta-rotate: true
    interaction:
      require-sneak-for-slab: true
      require-sneak-for-rotate: true
