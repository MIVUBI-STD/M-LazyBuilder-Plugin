name: Utilities-Manager
version: ${project.version}
main: com.halokaryamedia.lazybuilder.utilities.UtilitiesManagerPlugin
api-version: '1.21'
author: Halo Karya Media
description: Familiar builder utilities and safe building conveniences for the LazyBuilder suite.

commands:
  lb:
    description: Open the LazyBuilder Utilities help hub.
    usage: /lb [help|status|reload]
    aliases: [lazybuilder]
    permission: lazybuilder.utilities.help
  gmc:
    description: Switch to Creative mode.
    usage: /gmc
    permission: lazybuilder.utilities.gamemode
  gms:
    description: Switch to Survival mode.
    usage: /gms
    permission: lazybuilder.utilities.gamemode
  gma:
    description: Switch to Adventure mode.
    usage: /gma
    permission: lazybuilder.utilities.gamemode
  gmsp:
    description: Switch to Spectator mode.
    usage: /gmsp
    permission: lazybuilder.utilities.gamemode
  fly:
    description: Toggle builder flight or set/update its speed.
    usage: /fly [speed]
    permission: lazybuilder.utilities.fly
  noclip:
    description: Toggle temporary spectator-based noclip movement.
    usage: /noclip
    permission: lazybuilder.utilities.noclip
  nightvision:
    description: Toggle persistent builder night vision.
    usage: /nightvision
    aliases: [nv]
    permission: lazybuilder.utilities.nightvision

permissions:
  lazybuilder.builder:
    description: Familiar day-to-day LazyBuilder capabilities for builders.
    default: op
    children:
      lazybuilder.utilities.help: true
      lazybuilder.utilities.gamemode: true
      lazybuilder.utilities.fly: true
      lazybuilder.utilities.noclip: true
      lazybuilder.utilities.nightvision: true
      lazybuilder.utilities.build: true
  lazybuilder.admin:
    description: LazyBuilder administration and diagnostics.
    default: op
    children:
      lazybuilder.builder: true
      lazybuilder.utilities.status: true
      lazybuilder.utilities.reload: true

  lazybuilder.utilities.help:
    description: Use the LazyBuilder Utilities help hub.
    default: false
  lazybuilder.utilities.gamemode:
    description: Use familiar LazyBuilder gamemode shortcuts.
    default: false
  lazybuilder.utilities.fly:
    description: Use LazyBuilder Fly.
    default: false
  lazybuilder.utilities.noclip:
    description: Use LazyBuilder Noclip.
    default: false
  lazybuilder.utilities.nightvision:
    description: Use LazyBuilder Night Vision.
    default: false
  lazybuilder.utilities.build:
    description: Use passive LazyBuilder build helpers.
    default: false
  lazybuilder.utilities.status:
    description: View Utilities runtime diagnostics.
    default: false
  lazybuilder.utilities.reload:
    description: Reload Utilities configuration.
    default: false
