plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Optional compile-only surface for the version-pinned Xaero accessor.
    // Runtime LazyBuilder remains usable without Xaero installed.
    modCompileOnly "maven.modrinth:NcUtCpym:IBcL3f5W"
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', '../src/main/java']
            include 'com/halokaryamedia/lazybuilder/client/**'
            include 'com/halokaryamedia/lazybuilder/world/transfer/TransferWireProtocol.java'
            include 'com/halokaryamedia/lazybuilder/world/transfer/TransferDescriptor.java'
            include 'com/halokaryamedia/lazybuilder/world/map/MapActionWireProtocol.java'
            include 'com/halokaryamedia/lazybuilder/world/control/WorldControlWireProtocol.java'
            include 'com/halokaryamedia/lazybuilder/world/registry/WorldId.java'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
